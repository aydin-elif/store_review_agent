services:
  mongodb:
    image: mongo:7
    container_name: store_review_agent_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: review_agent
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: